name: Validate content

on:
  push:
    paths: ["data/**", "js/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "js/**", "tools/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate data/*.json
        run: python tools/validate.py
      - name: Test exam date logic
        run: node tools/test-exam.mjs
