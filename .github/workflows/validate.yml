name: Validate content

on:
  push:
    paths: ["data/**", "tools/**", ".github/workflows/validate.yml"]
  pull_request:
    paths: ["data/**", "tools/**"]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate data/*.json
        run: python tools/validate.py
