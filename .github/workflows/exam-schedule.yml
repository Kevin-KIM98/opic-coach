name: Update exam schedule

# 홈 화면 D-day 는 data/exam-schedule.json 의 공휴일로 "다음 응시 가능일" 을 계산합니다.
# 매달 1일에 공휴일을 갱신하고, 커버리지가 얼마 안 남았는데 갱신도 실패하면 이슈로 알립니다.
on:
  schedule:
    - cron: "0 20 1 * *"      # 매월 1일 05:00 KST
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh holidays
        id: refresh
        continue-on-error: true
        run: node tools/update-exam-schedule.mjs

      - name: Verify date logic still passes
        if: steps.refresh.outcome == 'success'
        run: node tools/test-exam.mjs

      - name: Commit if changed
        if: steps.refresh.outcome == 'success'
        run: |
          if git diff --quiet -- data/exam-schedule.json; then
            echo "변경 없음"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/exam-schedule.json
          git commit -m "시험 일정: 공휴일 자동 갱신"
          git push

      # 갱신이 실패했더라도 커버리지가 넉넉하면 조용히 넘어갑니다.
      - name: Check coverage
        id: coverage
        continue-on-error: true
        run: node tools/update-exam-schedule.mjs --check

      - name: Open an issue when the schedule needs a human
        if: steps.coverage.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = '시험 일정 데이터 갱신 필요';
            const body = [
              '`data/exam-schedule.json` 의 공휴일 커버리지가 얼마 남지 않았고 자동 갱신도 실패했습니다.',
              '',
              `- 자동 갱신: ${{ steps.refresh.outcome }}`,
              `- 실행 로그: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              '커버리지가 지나면 앱은 일요일만 제외하고 D-day를 계산하며, 홈 화면에 안내가 표시됩니다.',
              '`node tools/update-exam-schedule.mjs` 를 직접 돌리거나 `holidays` 를 손으로 채워 주세요.',
              '',
              '---',
              '_Generated by [Claude Code](https://claude.ai/code)_',
            ].join('\n');
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'exam-schedule',
            });
            if (open.length) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: open[0].number, body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['exam-schedule'],
              });
            }
